name: Release Debian Package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Lean project
        uses: leanprover/lean-action@v1

      - name: Create Debian package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0~git${GITHUB_SHA::7}"
          fi

          ./packaging/scripts/build-deb.sh "$VERSION"

          ARCH="$(dpkg --print-architecture)"
          DEB_FILE="packaging/dist/deb/lfetch_${VERSION}_${ARCH}/lfetch_${VERSION}_${ARCH}.deb"

          echo "deb_file=$DEB_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lfetch-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.deb_file }}
            .lake/build/bin/lfetch
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.deb_file }}
            .lake/build/bin/lfetch
